syntax = "proto3";

// C#'ta bu kod üretildiğinde hangi namespace altına girsin?
option csharp_namespace = "Shared.Contracts.Grpc";

package stock;

// Uzaktan çağrılabilecek fonksiyon tanımı (RPC)
service StockGrpcService {
  rpc CheckStock (StockGrpcRequest) returns (StockGrpcResponse);
}

// Girdi Parametreleri (1 ve 2 etiket numaralarıdır)
message StockGrpcRequest {
  int32 product_id = 1;
  int32 quantity = 2;
}

// Çıktı Parametreleri
message StockGrpcResponse {
  int32 product_id = 1;
  bool is_available = 2;
  int32 remaining_stock = 3;
  string message = 4;
}